<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Box Vote</title>
  <meta name="description" content="Vote for the Spring Box Minecraft server and get tokens and Vote keys.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12061c;
      --bg2: #1d0b2c;
      --card: #24103a;
      --card-hi: #2e1549;
      --line: #3d1f5a;
      --pink: #ff6fd8;
      --pink2: #ffb3ec;
      --green: #4cff00;
      --gold: #ffd400;
      --text: #ffffff;
      --muted: #b9a3c9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #3b1460 0%, transparent 60%), linear-gradient(180deg, var(--bg2), var(--bg));
      color: var(--text);
      font-family: "Nunito", system-ui, sans-serif;
    }
    main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
    header { text-align: center; }
    header img { width: min(420px, 90%); height: auto; filter: drop-shadow(0 8px 30px rgba(255, 111, 216, .35)); }
    h1 { font-family: "Press Start 2P", monospace; font-size: clamp(16px, 3.4vw, 24px); line-height: 1.5; margin: 8px 0 6px; color: var(--pink2); }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .reward { display: inline-flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line);
      padding: 10px 16px; border-radius: 999px; font-weight: 900; }
    .reward b { color: var(--gold); }
    .name { margin: 28px auto 8px; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
    .name label { font-weight: 700; color: var(--pink2); }
    .name input { font: inherit; font-size: 18px; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line);
      background: var(--bg); color: var(--text); outline: none; }
    .name input:focus { border-color: var(--pink); }
    .hint { color: var(--muted); font-size: 14px; text-align: center; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .site { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .site .top { display: flex; align-items: center; gap: 12px; }
    .num { font-family: "Press Start 2P", monospace; font-size: 12px; color: var(--bg); background: var(--green); border-radius: 8px; padding: 8px 9px; }
    .site h2 { font-size: 18px; margin: 0; }
    .site p { margin: 0; color: var(--muted); font-size: 14px; }
    .vote { font: inherit; font-weight: 900; font-size: 16px; cursor: pointer; border: 0; border-radius: 12px; padding: 13px;
      background: linear-gradient(90deg, var(--pink), #b25cff); color: #fff; transition: transform .08s ease, filter .15s ease; }
    .vote:hover { filter: brightness(1.1); }
    .vote:active { transform: translateY(1px); }
    .vote.done { background: var(--card-hi); color: var(--green); }
    .extra { text-align: center; margin-top: 28px; }
    .extra a { display: inline-block; color: var(--text); text-decoration: none; font-weight: 900; padding: 12px 18px; border-radius: 12px;
      border: 2px solid var(--line); background: var(--card); }
    .extra a:hover { border-color: var(--pink); }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--card-hi); border: 1px solid var(--pink);
      padding: 12px 18px; border-radius: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s ease; max-width: calc(100% - 32px); text-align: center; }
    .toast.show { opacity: 1; }
    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="logo.png" alt="Spring">
      <h1>Vote for Spring Box</h1>
      <p class="sub">Vote on all 6 sites every day</p>
      <div class="reward">Every vote: <b id="reward">1,000 Tokens + 1 Vote Key</b></div>
    </header>

    <div class="name">
      <label for="player">Your Minecraft name</label>
      <input id="player" maxlength="16" autocomplete="off" placeholder="Steve">
    </div>
    <p class="hint">We copy your name for you. Paste it on the vote site, then click vote there.</p>

    <section class="grid" id="sites"></section>

    <div class="extra" id="extra"></div>
    <footer>Rewards arrive in game right away, or the next time you join.</footer>
  </main>
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script>
    const cfg = window.SPRING_VOTE;
    const input = document.getElementById('player');
    const toast = document.getElementById('toast');
    document.getElementById('reward').textContent = cfg.reward;

    try { input.value = localStorage.getItem('springbox-name') || ''; } catch (e) {}
    input.addEventListener('input', () => { try { localStorage.setItem('springbox-name', input.value.trim()); } catch (e) {} });

    function show(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(show.t);
      show.t = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    const today = new Date().toISOString().slice(0, 10);
    function votedToday(i) { try { return localStorage.getItem('springbox-voted-' + i) === today; } catch (e) { return false; } }

    const grid = document.getElementById('sites');
    cfg.sites.forEach((s, i) => {
      const card = document.createElement('article');
      card.className = 'site';
      card.innerHTML = `<div class="top"><span class="num">#${i + 1}</span><h2></h2></div><p>Vote ${i + 1} of ${cfg.sites.length}</p>`;
      card.querySelector('h2').textContent = s.name;
      const btn = document.createElement('button');
      btn.className = 'vote' + (votedToday(i) ? ' done' : '');
      btn.textContent = votedToday(i) ? 'Voted today ✔' : 'Vote!';
      btn.addEventListener('click', async () => {
        const name = input.value.trim();
        if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) { show('Type your Minecraft name first'); input.focus(); return; }
        try { await navigator.clipboard.writeText(name); } catch (e) {}
        window.open(s.url, '_blank', 'noopener');
        try { localStorage.setItem('springbox-voted-' + i, today); } catch (e) {}
        btn.classList.add('done');
        btn.textContent = 'Voted today ✔';
        show('Name copied: ' + name + '. Paste it on ' + s.name);
      });
      card.appendChild(btn);
      grid.appendChild(card);
    });

    if (cfg.topVotersUrl) {
      const a = document.createElement('a');
      a.href = cfg.topVotersUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = '🏆 Top Voters';
      document.getElementById('extra').appendChild(a);
    }
  </script>
</body>
</html>
